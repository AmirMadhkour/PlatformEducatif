# ============================
# Application
# ============================
spring.application.name=plateforme-backend
server.port=8080

# ============================
# PostgreSQL
# Creer la base au prealable : CREATE DATABASE plateforme_education;
# ============================
spring.datasource.url=jdbc:postgresql://localhost:5432/plateforme_education
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ddl-auto=update 
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================
# JWT
# ============================
jwt.secret=ChangeMeInProdSuperSecretKeyForEduPlatformHS256AlgorithmMinimum256Bits
jwt.expiration-ms=86400000

# ============================
# Upload de fichiers (cours : video, PDF, PPT)
# ============================
upload.dir=${UPLOAD_DIR:${user.home}/eduplatform-uploads}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ============================
# CORS
# Origine(s) du frontend autorisee(s) a appeler l'API en cross-origin.
# Plusieurs origines : separees par des virgules.
# ============================
cors.allowed-origins=http://localhost:5173

# Numero WhatsApp de l'administration
app.whatsapp-admin-number=${WHATSAPP_ADMIN_NUMBER:21600000000}

# ============================
# Swagger / OpenAPI
# Une fois l'application lancee : http://localhost:8080/swagger-ui.html
# ============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================
# Divers
# ============================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ============================
# Zoom (Server-to-Server OAuth) - cours en ligne
# Variables a definir dans l'environnement, JAMAIS en dur ici :
#   ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET
# ============================
zoom.account-id=${ZOOM_ACCOUNT_ID:}
zoom.client-id=${ZOOM_CLIENT_ID:}
zoom.client-secret=${ZOOM_CLIENT_SECRET:}
zoom.timezone=${ZOOM_TIMEZONE:Africa/Tunis}